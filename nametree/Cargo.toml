[package]
name = "nametree"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = true
description = "A B+ tree of variable-length names packed into fixed-size pages over a pluggable page store. Built for Yak's directory streams, but knows nothing about Yak."
readme = "../README.md"
homepage = "https://github.com/sunbeam60/nametree"
keywords = [
    "b-tree",
    "directory",
    "filesystem",
    "storage",
    "no-std",
]
categories = ["data-structures", "filesystem", "no-std"]

[features]
default = ["std"]
# Adds FileStore. The core tree only needs `alloc`.
std = []

[dependencies]
zerocopy = { version = "0.8", features = ["derive"] }

[dev-dependencies]
proptest = "1"
# Reference implementation used to cross-check our pinned SipHash-1-3.
siphasher = "1"
